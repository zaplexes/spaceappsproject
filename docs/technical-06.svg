<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#eab18d" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1600" height="1800" rx="0" fill="#0b111b" stroke="none"/>
<text x="64" y="72" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#b2c8be">MARTIAN MAP  /  TECHNICAL BRIEF</text>
<text x="64" y="143" font-family="DejaVu Sans,sans-serif" font-size="48" font-weight="700" fill="#fff">Security, delivery &amp; open decisions</text>
<text x="64" y="188" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#9eb0c3">Development ownership, verification, release flow and handoff.</text>
<rect x="64" y="218" width="1472" height="52" rx="9" fill="#282326" stroke="none"/>
<text x="84" y="251" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#edb797">PROPOSED • Not implemented • Scientific goal, scoring weights and hosting provider remain undecided</text>
<rect x="64" y="310" width="720" height="402" rx="15" fill="#111d2b" stroke="#2c3d50"/>
<text x="91" y="352" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#f1ad87">01</text>
<text x="91" y="393" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Security boundaries</text>
<text x="91" y="440" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">Keep source-access credentials and database</text>
<text x="91" y="474" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">passwords on the server. Any browser imagery</text>
<text x="91" y="508" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">token must be deliberately public, scoped and</text>
<text x="91" y="542" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">origin-restricted where supported. Use</text>
<text x="91" y="576" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">parameterized SQL, request size limits and an</text>
<text x="91" y="610" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">allowlist for remotely fetched source URLs.</text>
<rect x="816" y="310" width="720" height="402" rx="15" fill="#111d2b" stroke="#2c3d50"/>
<text x="843" y="352" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#f1ad87">02</text>
<text x="843" y="393" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Identity and saved work</text>
<text x="843" y="440" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">Default proposal: anonymous browsing with</text>
<text x="843" y="474" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">browser-local mission drafts and JSON export.</text>
<text x="843" y="508" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">Shared plans/accounts are optional, not assumed.</text>
<text x="843" y="542" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">If added, enforce server-side authorization on</text>
<text x="843" y="576" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">every saved object. Authenticate ingestion and</text>
<text x="843" y="610" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">administrative operations.</text>
<rect x="64" y="740" width="720" height="402" rx="15" fill="#111d2b" stroke="#2c3d50"/>
<text x="91" y="782" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#f1ad87">03</text>
<text x="91" y="823" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Repository and local setup</text>
<text x="91" y="870" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">Proposed layout: frontend/, backend/, pipelines/,</text>
<text x="91" y="904" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">data/manifests/, infra/, tests/ and docs/. Commit</text>
<text x="91" y="938" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">schema migrations, example environment variables</text>
<text x="91" y="972" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">and lockfiles. Keep raw scientific data,</text>
<text x="91" y="1006" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">credentials and generated bulk assets out of Git.</text>
<rect x="816" y="740" width="720" height="402" rx="15" fill="#111d2b" stroke="#2c3d50"/>
<text x="843" y="782" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#f1ad87">04</text>
<text x="843" y="823" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Checks and release pipeline</text>
<text x="843" y="870" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">Pull request → build frontend → backend tests →</text>
<text x="843" y="904" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">scientific-data checks → staging → smoke test →</text>
<text x="843" y="938" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">release. Test mission validation, coordinate</text>
<text x="843" y="972" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">transforms, score invariants, source provenance</text>
<text x="843" y="1006" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">and job failures. Store immutable artifacts and</text>
<text x="843" y="1040" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">support code plus schema rollback plans.</text>
<rect x="64" y="1170" width="720" height="402" rx="15" fill="#111d2b" stroke="#2c3d50"/>
<text x="91" y="1212" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#f1ad87">05</text>
<text x="91" y="1253" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Phased delivery</text>
<text x="91" y="1300" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">1: verify Jezero sources and stops; agree the</text>
<text x="91" y="1334" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">scientific goal. 2: build local layered map and</text>
<text x="91" y="1368" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">evidence panels. 3: compare stops and review a</text>
<text x="91" y="1402" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">round-trip excursion. 4: add field view and</text>
<text x="91" y="1436" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">global discovery. No application or</text>
<text x="91" y="1470" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">infrastructure is deployed.</text>
<rect x="816" y="1170" width="720" height="402" rx="15" fill="#111d2b" stroke="#2c3d50"/>
<text x="843" y="1212" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#f1ad87">06</text>
<text x="843" y="1253" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#fff">Decisions awaiting the team</text>
<text x="843" y="1300" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">Accepted: Jezero Marswalk centerpiece; global</text>
<text x="843" y="1334" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">crater discovery supports it. Still open:</text>
<text x="843" y="1368" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">scientific goal/weights, exact base and stops,</text>
<text x="843" y="1402" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">crew/support profiles, stack acceptance, hosting</text>
<text x="843" y="1436" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">budget and accounts. Ask before implementation</text>
<text x="843" y="1470" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#bdccda">that depends on these choices.</text>
<path d="M64 1652 H1536" stroke="#2b3a4c"/>
<text x="64" y="1690" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#9eb0c3">Read technical-brief.md for linked sources, assumptions and competition timing.</text>
<text x="64" y="1730" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#8298ae">Architecture proposal for discussion • No live services or validated mission scores</text>
<text x="1400" y="1730" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#edb797">06 / 06</text>
</svg>
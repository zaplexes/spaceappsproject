name: Deploy Martian Map to GitHub Pages

on:
  push:
    branches: [master]
    paths-ignore:
      - docs/**
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Build for the configured Pages URL
        run: npm run build
        env:
          MARTIAN_MAP_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Install browser for hosting verification
        run: npx playwright install --with-deps chromium
      - name: Verify hosted asset paths and core interactions
        run: npx playwright test --config playwright.pages.config.ts
        env:
          MARTIAN_MAP_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Upload compiled website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish compiled website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
